<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:2400px; height:1350px; overflow:hidden; font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(180deg,#041229 0%,#0a2244 50%,#123a66 100%); position:relative; }
  .globo { position:absolute; font-size:520px; left:50%; top:56%; transform:translate(-50%,-50%); opacity:.95;
    filter:drop-shadow(0 0 90px rgba(80,160,255,.4)); }
  .rota { position:absolute; left:50%; top:54%; transform:translate(-50%,-50%); width:1500px; height:700px; }
  .aviao { position:absolute; font-size:170px; right:17%; top:17%; transform:rotate(18deg);
    filter:drop-shadow(0 10px 30px rgba(0,0,0,.6)); }
  .ponto { position:absolute; width:26px; height:26px; border-radius:50%; background:#ffd24a;
    box-shadow:0 0 26px 8px rgba(255,210,74,.6); }
  .rotulo { position:absolute; top:120px; width:100%; text-align:center; color:#fff; }
  .rotulo .g { font-size:120px; font-weight:900; font-family:'Arial Black',Arial;
    text-shadow:0 8px 44px rgba(0,0,15,.9); }
  .rotulo .p { font-size:50px; margin-top:14px; letter-spacing:6px; color:#a8d0f0; }
  .vin { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 50%, rgba(0,5,15,.7) 100%); }
</style>
<div class="globo">🌎</div>
<svg class="rota" viewBox="0 0 1500 700">
  <path d="M 260 560 Q 750 60 1240 220" stroke="#ffd24a" stroke-width="10" fill="none"
    stroke-dasharray="10 34" stroke-linecap="round" opacity="0.95"/>
</svg>
<div class="ponto" style="left:calc(50% - 490px); top:calc(54% + 210px);"></div>
<div class="ponto" style="left:calc(50% + 470px); top:calc(54% - 130px);"></div>
<div class="aviao">✈️</div>
<div class="rotulo"><div class="g">SEM FRONTEIRA</div><div class="p">DO BRASIL PARA O MUNDO</div></div>
<div class="vin"></div>
