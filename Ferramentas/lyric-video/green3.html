<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:2400px; height:1350px; overflow:hidden; font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(180deg,#0c1a3a 0%,#1e3a6e 40%,#e8944a 85%,#ffc86e 100%); position:relative; }
  .sol { position:absolute; width:380px; height:380px; border-radius:50%;
    background:radial-gradient(circle,#fff6d0 0%,#ffd76e 70%,#ffb84a 100%);
    left:50%; bottom:-80px; transform:translateX(-50%); box-shadow:0 0 200px 80px rgba(255,205,110,.45); }
  .estatua { position:absolute; font-size:560px; left:50%; top:52%; transform:translate(-50%,-50%);
    filter:drop-shadow(0 0 80px rgba(120,200,160,.35)); }
  .passaros { position:absolute; font-size:90px; left:20%; top:26%; opacity:.9; }
  .passaros2 { position:absolute; font-size:70px; right:20%; top:20%; opacity:.85; }
  .rotulo { position:absolute; top:100px; width:100%; text-align:center; color:#fff; }
  .rotulo .g { font-size:124px; font-weight:900; font-family:'Arial Black',Arial;
    text-shadow:0 10px 50px rgba(5,15,35,.9); }
  .rotulo .p { font-size:50px; margin-top:14px; letter-spacing:6px; color:#cfe2ff; }
  .vin { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 50%, rgba(5,10,25,.65) 100%); }
</style>
<div class="sol"></div>
<div class="estatua">🗽</div>
<div class="passaros">🕊️</div>
<div class="passaros2">🕊️</div>
<div class="rotulo"><div class="g">LIBERDADE</div><div class="p">AGORA NINGUÉM SEGURA</div></div>
<div class="vin"></div>
