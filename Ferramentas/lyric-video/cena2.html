<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:2400px; height:1350px; overflow:hidden; font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(180deg,#050a1c 0%,#0a1735 45%,#14264f 75%,#1b3060 100%); position:relative; }
  .moon { position:absolute; width:220px; height:220px; border-radius:50%; background:#f5f0dc;
    top:130px; right:340px; box-shadow:0 0 120px 40px rgba(245,240,220,.35); }
  .skyline { position:absolute; bottom:0; left:0; right:0; height:760px; display:flex; align-items:flex-end; gap:26px; padding:0 60px; }
  .b { background:#04070f; position:relative; box-shadow:inset 0 30px 60px rgba(255,255,255,.02); }
  .b::after { content:''; position:absolute; inset:26px 18px;
    background-image:repeating-linear-gradient(0deg, rgba(255,214,90,.75) 0 14px, transparent 14px 46px),
      repeating-linear-gradient(90deg, rgba(255,214,90,.75) 0 12px, transparent 12px 40px);
    -webkit-mask-image:repeating-linear-gradient(0deg,#000 0 14px,transparent 14px 46px);
    opacity:.35; }
  .plane { position:absolute; font-size:150px; top:230px; left:320px; transform:rotate(-8deg); opacity:.95; }
  .trail { position:absolute; top:390px; left:-100px; width:420px; height:6px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.5)); transform:rotate(-8deg); }
  .rotulo { position:absolute; top:660px; width:100%; text-align:center; color:#fff; }
  .rotulo .g { font-size:120px; font-weight:900; font-family:'Arial Black',Arial; letter-spacing:4px;
    text-shadow:0 8px 40px rgba(0,0,0,.9); }
  .rotulo .p { font-size:52px; color:#9fb4e0; margin-top:14px; letter-spacing:6px; }
  .vin { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,10,.7) 100%); }
</style>
<div class="moon"></div>
<div class="skyline">
  <div class="b" style="width:190px;height:520px"></div>
  <div class="b" style="width:150px;height:640px"></div>
  <div class="b" style="width:230px;height:440px"></div>
  <div class="b" style="width:170px;height:700px"></div>
  <div class="b" style="width:260px;height:560px"></div>
  <div class="b" style="width:150px;height:760px"></div>
  <div class="b" style="width:210px;height:480px"></div>
  <div class="b" style="width:180px;height:660px"></div>
  <div class="b" style="width:240px;height:540px"></div>
  <div class="b" style="width:160px;height:720px"></div>
  <div class="b" style="width:220px;height:460px"></div>
  <div class="b" style="width:190px;height:600px"></div>
</div>
<div class="trail"></div><div class="plane">✈️</div>
<div class="rotulo"><div class="g">A SEGUNDA CASA</div><div class="p">DO OUTRO LADO DO MUNDO • EUA</div></div>
<div class="vin"></div>
