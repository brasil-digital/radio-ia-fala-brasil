<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:2400px; height:1350px; overflow:hidden; font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(180deg,#062a1a 0%,#0a4a2a 45%,#0e6a3a 80%,#12854a 100%); position:relative; }
  .luz { position:absolute; width:1400px; height:800px; left:50%; top:60%; transform:translate(-50%,-50%);
    background:radial-gradient(ellipse,rgba(255,240,180,.25) 0%,transparent 65%); }
  .aviao { position:absolute; font-size:230px; left:14%; top:16%; transform:rotate(12deg);
    filter:drop-shadow(0 14px 40px rgba(0,0,0,.5)); }
  .coracao { position:absolute; font-size:260px; left:50%; top:56%; transform:translate(-50%,-50%);
    filter:drop-shadow(0 0 70px rgba(60,255,140,.45)); }
  .familia { position:absolute; font-size:210px; right:13%; bottom:16%; }
  .trilha { position:absolute; top:340px; left:6%; width:520px; height:6px; transform:rotate(12deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.45)); border-radius:6px; }
  .rotulo { position:absolute; top:110px; width:100%; text-align:center; color:#fff; }
  .rotulo .g { font-size:114px; font-weight:900; font-family:'Arial Black',Arial;
    text-shadow:0 8px 44px rgba(0,20,5,.9); }
  .rotulo .p { font-size:50px; margin-top:14px; letter-spacing:6px; color:#c8f0d8; }
  .vin { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 50%, rgba(0,10,4,.68) 100%); }
</style>
<div class="luz"></div>
<div class="trilha"></div>
<div class="aviao">✈️</div>
<div class="coracao">💚</div>
<div class="familia">👨‍👩‍👧‍👦</div>
<div class="rotulo"><div class="g">DE VOLTA PRA ABRAÇAR</div><div class="p">O PRIMEIRO VOO PRA CASA</div></div>
<div class="vin"></div>
