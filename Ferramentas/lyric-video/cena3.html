<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:2400px; height:1350px; overflow:hidden; font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(180deg,#ffb347 0%,#ff7b3d 30%,#e8542f 55%,#7a2648 80%,#3d1230 100%); position:relative; }
  .sol { position:absolute; width:420px; height:420px; border-radius:50%;
    background:radial-gradient(circle,#fff3c4 0%,#ffd24a 60%,#ff9d2e 100%);
    left:50%; top:300px; transform:translateX(-50%); box-shadow:0 0 200px 80px rgba(255,210,74,.5); }
  .morro { position:absolute; bottom:0; width:100%; height:420px;
    background:radial-gradient(ellipse 70% 100% at 25% 100%, #1a0a14 99%, transparent 100%),
               radial-gradient(ellipse 55% 85% at 75% 100%, #241021 99%, transparent 100%); }
  .cristo { position:absolute; bottom:340px; left:23%; width:14px; height:150px; background:#140810; }
  .cristo::before { content:''; position:absolute; top:26px; left:-58px; width:130px; height:14px; background:#140810; }
  .cristo::after { content:''; position:absolute; bottom:-30px; left:-20px; width:54px; height:34px; background:#140810; }
  .palma { position:absolute; font-size:200px; bottom:250px; right:8%; }
  .rotulo { position:absolute; top:120px; width:100%; text-align:center; color:#fff; }
  .rotulo .g { font-size:120px; font-weight:900; font-family:'Arial Black',Arial;
    text-shadow:0 8px 44px rgba(60,10,10,.8); }
  .rotulo .p { font-size:52px; margin-top:12px; letter-spacing:6px; color:#ffe9b0; }
  .coracao { position:absolute; font-size:150px; left:10%; top:430px; transform:rotate(-12deg); }
  .vin { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 52%, rgba(30,5,20,.65) 100%); }
</style>
<div class="sol"></div>
<div class="morro"></div>
<div class="cristo"></div>
<div class="palma">🌴</div>
<div class="coracao">💚</div>
<div class="rotulo"><div class="g">O PRIMEIRO AMOR</div><div class="p">BRASIL • ONDE O CORAÇÃO FICOU</div></div>
<div class="vin"></div>
